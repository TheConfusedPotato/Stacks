<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>On Break — Stacks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0F0F11;
      --surface: #18181A;
      --surface-raised: #201F21;
      --border: #2C2A2C;
      --border-soft: #242224;
      --text-primary: #EBEAE6;
      --text-secondary: #8C8A86;
      --text-muted: #5A5856;
      --teal: #4FA893;
      --amber: #D2984E;
      --red: #BD564C;
      --amber-border: #3A2E1E;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F0F11;
        --surface: #18181A;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    .mark {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-decoration: none;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--amber);
      background: #241E16;
      border: 1px solid var(--amber-border);
      padding: 4px 10px;
      border-radius: 2px;
    }

    /* ---- Main ---- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 24px;
      gap: 0;
    }

    .seat-line {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .seat-line strong {
      color: var(--text-secondary);
    }

    /* Countdown ring */
    .ring-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 32px;
    }
    .ring-svg {
      width: 200px;
      height: 200px;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: var(--border);
      stroke-width: 6;
    }
    .ring-arc {
      fill: none;
      stroke: var(--amber);
      stroke-width: 6;
      stroke-linecap: round;
      /* circumference ≈ 2π × 88 ≈ 553; full arc */
      stroke-dasharray: 553;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .ring-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .break-timer {
      font-family: 'Fraunces', serif;
      font-size: 38px;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .timer-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .timer-sub {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 8px;
    }

    .warning-note {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      max-width: 300px;
    }
    .warning-note strong {
      color: var(--amber);
    }

    /* ---- Footer ---- */
    footer {
      padding: 20px 24px calc(20px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border-soft);
    }
    .cta {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--teal);
      color: #0D1F1B;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .cta:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <span class="mark">Stacks</span>
    <span class="status-pill">On Break</span>
  </header>

  <main>
    <p class="seat-line">Seat <strong>—</strong></p>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="88" />
        <circle class="ring-arc"   cx="100" cy="100" r="88" />
      </svg>
      <div class="ring-inner">
        <span class="break-timer">--:--</span>
        <span class="timer-label">remaining</span>
      </div>
    </div>

    <p class="timer-sub">Loading…</p>

    <p class="warning-note">
      If you don't return in time, your seat is freed and
      <strong>belongings moved to the front-desk collection area</strong>.
    </p>
  </main>

  <footer>
    <button class="cta">I'm back</button>
  </footer>

  <!-- Arc animation: app.js drives the timer text; this script handles the SVG arc -->
  <script>
    (function () {
      const arc = document.querySelector('.ring-arc');
      const CIRC = 553; // 2π × 88

      // Called by initBreakActive after it knows breakEndsAt
      window._updateBreakArc = function (remMs, totalMs) {
        if (!arc || totalMs <= 0) return;
        const fraction = Math.max(0, Math.min(1, remMs / totalMs));
        arc.style.strokeDashoffset = String(CIRC * (1 - fraction));
      };
    })();
  </script>

  <!-- Paths are relative to /html/. Module scripts always run after classic scripts;
       the stores wait for the "stacks:supabase-ready" event, so order here is safe. -->
  <script type="module" src="../scripts/supabase.js?v=2.3"></script>
  <script src="../scripts/constants.js?v=2.2"></script>
  <script src="../scripts/min-heap.js?v=2.2"></script>
  <script src="../scripts/notification-store.js?v=2.2"></script>
  <script src="../scripts/seat-store.js?v=2.2"></script>
  <script src="../scripts/auth-store.js?v=2.2"></script>
  <script src="../scripts/history-store.js?v=2.2"></script>
  <script src="../scripts/timer-queue.js?v=2.2"></script>
  <script src="../scripts/app.js?v=2.2"></script>

</body>
</html>
