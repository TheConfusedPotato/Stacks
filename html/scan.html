<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan seat — Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F10;
    --surface:#18181A;
    --border:#2C2A2C;
    --border-soft:#232224;
    --text-primary:#EBEAE6;
    --text-secondary:#8C8A86;
    --text-muted:#5D5B58;
    --teal:#4FA893;
    --amber:#D2984E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    line-height:1.5;
  }

  header{
    padding:20px 20px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .mark{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .timer-chip{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--amber);
    color:var(--amber);
    padding:6px 12px;
    border-radius:2px;
    font-size:13px;
    font-weight:500;
  }
  .timer-chip .dot{
    width:6px;height:6px;border-radius:50%;background:var(--amber);
  }

  .viewfinder-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 24px 30px;
    text-align:center;
  }

  .instruction{
    font-family:'Fraunces',serif;
    font-size:clamp(22px,6vw,26px);
    font-weight:500;
    margin-bottom:8px;
  }
  .instruction-sub{
    color:var(--text-secondary);
    font-size:13px;
    margin-bottom:36px;
    max-width:30ch;
  }

  .frame{
    width:min(78vw,320px);
    aspect-ratio:1;
    position:relative;
    margin-bottom:36px;
  }
  .corner{
    position:absolute;
    width:36px;height:36px;
    border-color:var(--teal);
    border-style:solid;
    border-width:0;
  }
  .corner.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:4px;}
  .corner.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:4px;}
  .corner.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:4px;}
  .corner.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:4px;}
  .frame-inner{
    position:absolute;
    inset:14px;
    border:1px dashed var(--border);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame-inner span{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.05em;
  }

  .seat-tag{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);
    background:var(--surface);
    padding:10px 18px;
    border-radius:2px;
    margin-bottom:6px;
  }
  .seat-tag .label{font-size:11px;color:var(--text-muted);}
  .seat-tag .value{
    font-family:'Fraunces',serif;
    font-size:15px;font-weight:600;
  }

  footer{
    padding:18px 24px 28px;
    border-top:1px solid var(--border-soft);
  }
  .fallback{
    display:block;
    width:100%;
    text-align:center;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-secondary);
    padding:15px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border-radius:2px;
  }

  @media (min-width:600px){
    header,footer{padding-left:36px;padding-right:36px;}
  }
</style>
</head>
<body>
  <header>
    <span class="mark">Stacks</span>
    <div class="timer-chip"><span class="dot"></span> 07:42 to scan</div>
  </header>

  <div class="viewfinder-wrap">
    <p class="instruction">Scan the QR at seat A2</p>
    <p class="instruction-sub">It's on a small tag fixed to the desk. Hold steady.</p>

    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="frame-inner"><span>align QR here</span></div>
    </div>

    <div class="seat-tag">
      <span class="label">booked</span>
      <span class="value">Seat A2</span>
    </div>
  </div>

  <footer>
    <button class="fallback" type="button">Can't scan? Enter seat code manually</button>
  </footer>
      <!-- Stacks Client-Side Backend & Controllers -->
  <script type="module" src="../scripts/supabase.js?v=2.3"></script>
  <script src="../scripts/constants.js?v=2.2"></script>
  <script src="../scripts/min-heap.js?v=2.2"></script>
  <script src="../scripts/seat-store.js?v=2.2"></script>
  <script src="../scripts/timer-queue.js?v=2.2"></script>
  <script src="../scripts/auth-store.js?v=2.2"></script>
  <script src="../scripts/history-store.js?v=2.2"></script>
  <script src="../scripts/notification-store.js?v=2.2"></script>
  <script src="../scripts/app.js?v=2.2"></script>
</body>
</html>
