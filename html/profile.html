<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F10; --surface:#18181A; --surface-raised:#201F21;
    --border:#2C2A2C; --border-soft:#232224;
    --text-primary:#EBEAE6; --text-secondary:#8C8A86; --text-muted:#5D5B58;
    --teal:#4FA893; --red:#BD564C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    display:flex;flex-direction:column;
    line-height:1.5;
    padding-bottom:84px;
  }
  header{
    padding:18px 20px;
    border-bottom:1px solid var(--border-soft);
  }
  .mark{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}

  main{flex:1;padding:26px 20px 10px;}

  .id-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
    padding:22px;
    margin-bottom:28px;
    display:flex;gap:16px;align-items:center;
  }
  .id-avatar{
    width:56px;height:56px;flex-shrink:0;
    border-radius:2px;
    background:var(--surface-raised);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:22px;color:var(--text-secondary);
  }
  .id-info .name{
    font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:3px;
  }
  .id-info .meta{font-size:11.5px;color:var(--text-muted);line-height:1.6;}
  .id-info .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;color:var(--teal);margin-top:6px;
  }
  .id-info .badge .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);}

  .section-label{
    font-size:11px;color:var(--text-muted);letter-spacing:0.04em;margin:0 0 10px;
  }

  .list-group{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
    margin-bottom:26px;
    overflow:hidden;
  }
  .list-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:15px 16px;
    border-bottom:1px solid var(--border-soft);
    text-decoration:none;
    color:var(--text-primary);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .label{font-size:13.5px;}
  .list-row .value{font-size:12.5px;color:var(--text-muted);}
  .list-row .chev{color:var(--text-muted);font-family:'Fraunces',serif;}

  .signout{
    display:block;width:100%;text-align:center;
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
    padding:15px;border-radius:2px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    text-decoration:none;
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--bg);
    border-top:1px solid var(--border-soft);
    padding:10px 12px 14px;
  }
  nav.tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    text-decoration:none;color:var(--text-muted);font-size:10px;
  }
  nav.tabbar a.active{color:var(--teal);}
  nav.tabbar .glyph{font-family:'Fraunces',serif;font-size:16px;}

  @media (min-width:600px){
    header,main{padding-left:36px;padding-right:36px;}
  }
</style>
</head>
<body>
  <header>
    <span class="mark">Profile</span>
  </header>

  <main>
    <div class="id-card">
      <div class="id-avatar">A</div>
      <div class="id-info">
        <div class="name">Ananya Rao</div>
        <div class="meta">ananya@pict.edu<br>B.Tech CSE · 3rd year</div>
        <div class="badge"><span class="dot"></span> verified card</div>
      </div>
    </div>

    <p class="section-label">Account</p>
    <div class="list-group">
      <a class="list-row" href="javascript:void(0)">
        <span class="label">Edit name and details</span>
        <span class="chev">›</span>
      </a>
      <a class="list-row" href="forgot-password.html">
        <span class="label">Change password</span>
        <span class="chev">›</span>
      </a>
    </div>

    <p class="section-label">Preferences</p>
    <div class="list-group">
      <a class="list-row" href="javascript:void(0)">
        <span class="label">Notification settings</span>
        <span class="chev">›</span>
      </a>
      <a class="list-row" href="javascript:void(0)">
        <span class="label">Preferred zone</span>
        <span class="value">Silent zone ›</span>
      </a>
    </div>

    <p class="section-label">Support</p>
    <div class="list-group">
      <a class="list-row" href="javascript:void(0)">
        <span class="label">Report an issue</span>
        <span class="chev">›</span>
      </a>
      <a class="list-row" href="javascript:void(0)">
        <span class="label">Library seating policy</span>
        <span class="chev">›</span>
      </a>
    </div>

    <a class="signout" href="signin.html">Sign out</a>
  </main>

  <nav class="tabbar">
    <a href="dashboard.html"><span class="glyph">⌂</span>Home</a>
    <a href="matrix.html"><span class="glyph">▦</span>Seats</a>
    <a href="history.html"><span class="glyph">◷</span>History</a>
    <a class="active" href="profile.html"><span class="glyph">◐</span>Profile</a>
  </nav>
      <!-- Stacks Client-Side Backend & Controllers -->
  <script type="module" src="../scripts/supabase.js?v=2.3"></script>
  <script src="../scripts/constants.js?v=2.2"></script>
  <script src="../scripts/min-heap.js?v=2.2"></script>
  <script src="../scripts/seat-store.js?v=2.2"></script>
  <script src="../scripts/timer-queue.js?v=2.2"></script>
  <script src="../scripts/auth-store.js?v=2.2"></script>
  <script src="../scripts/history-store.js?v=2.2"></script>
  <script src="../scripts/notification-store.js?v=2.2"></script>
  <script src="../scripts/app.js?v=2.2"></script>
</body>
</html>
