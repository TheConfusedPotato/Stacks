<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff sign in — Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F10; --surface:#18181A; --surface-raised:#201F21;
    --border:#2C2A2C; --border-soft:#232224;
    --text-primary:#EBEAE6; --text-secondary:#8C8A86; --text-muted:#5D5B58;
    --teal:#4FA893; --amber:#D2984E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;line-height:1.5;
  }
  .card{
    width:100%;max-width:400px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
  }
  .content{padding:36px 32px 32px;}
  .catalog-row{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
  }
  .mark{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .role-tag{
    font-size:10px;color:var(--amber);border:1px solid var(--amber);
    padding:3px 8px;border-radius:2px;letter-spacing:0.05em;
  }
  .call-number{font-size:11px;color:var(--text-muted);margin-bottom:30px;}

  h1{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:clamp(26px,7vw,30px);line-height:1.2;margin-bottom:8px;
  }
  .sub{color:var(--text-secondary);font-size:13px;margin-bottom:30px;max-width:32ch;}

  form{display:flex;flex-direction:column;gap:18px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  label{font-size:11px;color:var(--text-secondary);letter-spacing:0.03em;}
  input{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;padding:14px;border-radius:2px;outline:none;width:100%;
  }
  input:focus{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);}
  input::placeholder{color:var(--text-muted);}

  .cta{
    margin-top:8px;
    background:var(--amber);color:#241B0D;
    border:none;padding:16px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;font-size:14px;letter-spacing:0.02em;
    border-radius:2px;cursor:pointer;width:100%;
  }

  .footer-row{
    text-align:center;font-size:12px;color:var(--text-muted);margin-top:24px;
  }
  .footer-row a{color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--border);}
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="catalog-row">
        <span class="mark">Stacks</span>
        <span class="role-tag">staff access</span>
      </div>
      <p class="call-number">PICT / LIB-04 · personnel portal</p>

      <h1>Staff sign in</h1>
      <p class="sub">For library personnel and admins only. Students should use the regular sign-in page.</p>

      <form>
        <div class="field">
          <label for="staff-id">Staff ID <span style="color:var(--text-muted);font-weight:400;font-size:11px;">(default: LIB-0042)</span></label>
          <input id="staff-id" type="text" placeholder="LIB-0042" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password <span style="color:var(--text-muted);font-weight:400;font-size:11px;">(default: admin123)</span></label>
          <input id="password" type="password" placeholder="admin123" autocomplete="current-password">
        </div>
        <button class="cta" type="submit">Sign in</button>
      </form>

      <div class="demo-card" style="margin-top:18px;padding:12px 14px;background:var(--surface-raised);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:2px;font-size:12px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:500;color:var(--text-primary);margin-bottom:2px;">Staff Demo Credentials</div>
          <div style="color:var(--text-muted);font-size:11px;">ID: <strong style="color:var(--teal);">LIB-0042</strong> · Pass: <strong style="color:var(--teal);">admin123</strong></div>
        </div>
        <button type="button" id="fill-demo-staff" style="background:var(--teal-fill);border:1px solid var(--teal);color:var(--teal);padding:5px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;border-radius:2px;cursor:pointer;">Auto-fill</button>
      </div>

      <p class="footer-row">Not staff? <a href="signin.html">Go to student sign-in</a></p>
    </div>
  </div>
      <!-- Stacks Client-Side Backend & Controllers -->
  <script type="module" src="scripts/supabase.js?v=2.3"></script>
  <script src="scripts/constants.js?v=2.2"></script>
  <script src="scripts/min-heap.js?v=2.2"></script>
  <script src="scripts/seat-store.js?v=2.2"></script>
  <script src="scripts/timer-queue.js?v=2.2"></script>
  <script src="scripts/auth-store.js?v=2.2"></script>
  <script src="scripts/history-store.js?v=2.2"></script>
  <script src="scripts/notification-store.js?v=2.2"></script>
  <script src="scripts/app.js?v=2.2"></script>
</body>
</html>
